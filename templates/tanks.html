<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
	<link rel="stylesheet" href="/css/themes/Pi2O.css" />
	<link rel="stylesheet" href="/css/themes/jquery.mobile.icons.min.css" />
	<link href="/images/favicon.ico" rel="shortcut icon" type="image/x-icon" />
	<script src="https://code.jquery.com/jquery-2.2.4.min.js" integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js" integrity="sha256-Lsk+CDPOzTapLoAzWW0G/WeQeViS3FMzywpzPZV8SXk=" crossorigin="anonymous"></script>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js" charset="utf-8"></script>
	<style>
	.ui-hide-label.ui-br, .no-field-separator {
		border-bottom-width: 0;
	}
	.ui-field-contain.ui-hide-label, .no-field-separator {
		margin: 1em 0;
		padding: 0;
	}
	.sixcol {
		/* Based on https://stackoverflow.com/questions/6161377/more-than-5-items-per-line-in-jquery-mobile-navbar */
		width: 16.66% !important;  /* 16.66% for 6 tabs wide */
		clear: none !important;  /* Prevent line break caused by ui-block-a */
	}
	.sevencol {
		/* Based on https://stackoverflow.com/questions/6161377/more-than-5-items-per-line-in-jquery-mobile-navbar */
		width: 14.285% !important;  /* 14.2856% for 7 tabs wide */
		clear: none !important;  /* Prevent line break caused by ui-block-a */
	}
	</style>
</head>
<body>
	<div id="tanks" data-role="page">
	<script type="text/javascript">
	  jQuery.htmlPrefilter = function( html ) { return html;};
		
		function plotTanks(json_data) {
      var data = [{x: json_data['timestamp'],
                   y: json_data['volume'],
                   error_y: {type: 'data',
                             array: json_data['volume_error'],
                             visible: false
                            },
                   type: 'scatter'
                  }];
      var layout = {xaxis: {title: {text: 'UTC Date'}},
                    yaxis: {title: {text: 'Volume [gal]'}},
                    plot_bgcolor: '#f3eee7',
                    paper_bgcolor: '#f3eee7'
                   };
      Plotly.newPlot('volume-plot', data, layout);
		}
		
		function onload() {
      $.ajax({url: "/query/tanks",
				      type: "GET",
					    success: plotTanks,
					    dataType: "json",
					    timeout: 10000
			       });
		}
		
		$(document).on("pagecreate", "#tanks", onload);
	</script>
	
	<div id="tanksPage"></div>
  
	<div data-role="header" role="banner" class="ui-header ui-bar-inherit">
		<h1 class="ui-title" role="heading" aira-level="1">Tank Volume</h1>
	</div>
	
	<div data-role="main" class="ui-content">
		<div id="volume-plot" class="ui-field-contain"></div>
	</div>
	
	<br />
	<div data-role="footer" role="banner" class="ui-header ui-bar-inherit">
		<div data-role="navbar">
			<ul>
				<li class="sevencol"><a href="/">Home</a></li>
				<li class="sevencol"><a class="ui-btn-active" href="/tanks">Tanks</a></li>
				<li class="sevencol"><a href="/zones">Zones</a></li>
				<li class="sevencol"><a href="/schedules">Schedules</a></li>
				<li class="sevencol"><a href="/weather">Weather</a></li>
				<li class="sevencol"><a href="/manual">Manual Control</a></li>
				<li class="sevencol"><a href="/logs">Logs</a></li>
			</ul>
		</div>
	</div>
	</div>
</body>
</html>
